name: Deploy a cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Producción: se publica en la raíz de ortodonciaparatodos.cl
# Para una vista previa en subcarpeta: BASE_PATH: /prueba y SUBDIR: prueba
env:
  BASE_PATH: ''
  SUBDIR: ''

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Calcular carpeta destino
        id: dest
        env:
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          DIR="${FTP_DIR%/}"
          [ -n "$SUBDIR" ] && DIR="$DIR/$SUBDIR"
          echo "dir=$DIR/" >> "$GITHUB_OUTPUT"

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ steps.dest.outputs.dir }}
